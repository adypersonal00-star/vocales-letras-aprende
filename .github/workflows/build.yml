name: Build and emulator-test Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: python3 -c "import zipfile; zipfile.ZipFile('vocales-letras-aprende-source.zip').extractall('project')"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        working-directory: project
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and smoke-test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: project
          script: python3 scripts/emulator_smoke.py
      - name: Upload tested debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vocales-letras-aprende-emulator-tested
          path: project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
